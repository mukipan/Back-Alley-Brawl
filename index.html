<!-- ==================== 🌐 PeerJS オンライン通信対戦拡張パッチ（V10最終完成版：路地裏＆BGMロック完全固定・両者スタート100%同期） ==================== -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function() {
    if (window.__ONLINE_VS_PATCH_V10_LOADED__) return;
    window.__ONLINE_VS_PATCH_V10_LOADED__ = true;

    if (typeof window.Peer === 'undefined') {
        var fallbackScript = document.createElement('script');
        fallbackScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
        document.head.appendChild(fallbackScript);
    }

    var ROOM_PREFIX = 'rojiura-brawl-v30-room-';
    var ALLOWED_PACKET_TYPES = [
        'hello', 'rule_sync', 'char_select', 'ready_sync', 'launch_match',
        'pad', 'attack', 'p2_sync', 'match_state', 'hit_sync', 'round_end_sync',
        'round_next', 'rematch', 'bye'
    ];
    var ALLOWED_MOVES = ['light', 'heavy', 'special', 'super'];
    var ALLOWED_AURAS = ['none', 'blue', 'emerald', 'purple', 'crimson', 'gold'];
    var ALLOWED_STATES = ['idle', 'walk', 'jump', 'crouch', 'attack', 'hit', 'ko', 'dizzy'];

    var isOnlineMode = false;
    var onlineRole = null; // 'host' (1P・左側) | 'guest' (2P・右側)
    var onlineRoomCode = '';
    var onlineUseUpgrades = false; // false: 強化なし(標準公平) / true: 強化あり(育成Lv.20＆オーラ有効)
    var peerInstance = null;
    var peerConn = null;
    var onlineConnected = false;
    var selectSyncInterval = null;
    var launchRetryTimers = [];

    var myOnlineCharId = 'ryuji';
    var remotePeerCharId = 'takeshi';
    var remotePeerUpgrades = { atk: 1, hp: 1, mtr: 1 };
    var remotePeerAuraId = 'none';
    var myReadyState = false;
    var remoteReadyState = false;
    var isLaunchingMatch = false;

    var myLocalPad = { left: false, right: false, up: false, down: false };
    var remoteOnlinePad = { left: false, right: false, up: false, down: false };
    var lastSentPad = { left: false, right: false, up: false, down: false };

    var isExecutingRemoteAttack = false;
    var isReroutingGuestAttack = false;
    var isApplyingRemoteRoundEnd = false;

    // =========================================================================
    // 0. ステージを「路地裏」・BGMを「♪1 ロック」に完全固定し選択UIを非表示にする機構
    // =========================================================================
    function enforceAlleyStageAndRockBgm(applyClickAlso) {
        var selectScreen = document.getElementById('char-select-screen');
        if (!selectScreen) return;

        var buttons = selectScreen.querySelectorAll('button');
        var alleyBtn = null;
        var rockBtn = null;

        for (var i = 0; i < buttons.length; i++) {
            var b = buttons[i];
            var txt = (b.textContent || '').trim();
            var oc = b.getAttribute('onclick') || '';

            if (txt.indexOf('路地裏') !== -1 || oc.indexOf("'alley'") !== -1 || oc.indexOf('"alley"') !== -1) {
                alleyBtn = b;
            }
            if (txt.indexOf('ロック') !== -1 || txt.indexOf('♪1') !== -1 || oc.indexOf('selectBgm(1)') !== -1 || oc.indexOf("selectBgm('1')") !== -1) {
                rockBtn = b;
            }

            // ステージ選択行・BGM選択行の親コンテナを特定して非表示にする
            if (
                txt.indexOf('路地裏') !== -1 || txt.indexOf('筋肉ジム') !== -1 ||
                txt.indexOf('ロック') !== -1 || txt.indexOf('ビート') !== -1 || txt.indexOf('高速') !== -1 ||
                oc.indexOf('Stage') !== -1 || oc.indexOf('Bgm') !== -1 || oc.indexOf('BGM') !== -1
            ) {
                var row = b.parentElement;
                if (row && row !== selectScreen && !row.querySelector('#p1-card-ryuji') && !row.querySelector('button[onclick="startGame()"]')) {
                    row.style.display = 'none';
                }
            }
        }

        // 内部変数を「路地裏」と「♪1 ロック」に固定
        try { if (typeof selectedStageId !== 'undefined') selectedStageId = 'alley'; } catch (e) {}
        try { if (typeof currentStageId !== 'undefined')  currentStageId  = 'alley'; } catch (e) {}
        try { if (typeof selectedStage !== 'undefined')   selectedStage   = 'alley'; } catch (e) {}
        try { if (typeof selectedBgmTrack !== 'undefined') selectedBgmTrack = 1; } catch (e) {}
        try { if (typeof currentBgmMode !== 'undefined')   currentBgmMode   = 1; } catch (e) {}
        try { if (typeof bgmTrack !== 'undefined')         bgmTrack         = 1; } catch (e) {}

        if (applyClickAlso) {
            var prevSe = (typeof sfx !== 'undefined' && sfx) ? sfx.seEnabled : true;
            try {
                if (typeof sfx !== 'undefined' && sfx) sfx.seEnabled = false;
                if (alleyBtn) alleyBtn.click();
                if (rockBtn)  rockBtn.click();
            } catch (e) {} finally {
                if (typeof sfx !== 'undefined' && sfx) sfx.seEnabled = prevSe;
            }
        }
    }

    // 全30キャラの本来の技ボタンラベル辞書をバックアップ保存
    var SAVED_CHAR_MOVE_LABELS = {};
    function backupOriginalMoveLabels() {
        if (typeof CHAR_MOVE_BUTTON_LABELS === 'undefined') return;
        ALL_CHAR_IDS.forEach(function(id) {
            if (CHAR_MOVE_BUTTON_LABELS[id] && !SAVED_CHAR_MOVE_LABELS[id]) {
                SAVED_CHAR_MOVE_LABELS[id] = {
                    light:   CHAR_MOVE_BUTTON_LABELS[id].light,
                    heavy:   CHAR_MOVE_BUTTON_LABELS[id].heavy,
                    special: CHAR_MOVE_BUTTON_LABELS[id].special
                };
            }
        });
    }
    backupOriginalMoveLabels();

    function syncMoveLabelDictionaryForRole() {
        backupOriginalMoveLabels();
        if (typeof CHAR_MOVE_BUTTON_LABELS === 'undefined') return;
        if (isOnlineMode && onlineConnected) {
            var myId = ALL_CHAR_IDS.includes(myOnlineCharId) ? myOnlineCharId : 'ryuji';
            if (onlineRole === 'guest' && player2 && ALL_CHAR_IDS.includes(player2.id)) {
                myId = player2.id;
            } else if (onlineRole === 'host' && player1 && ALL_CHAR_IDS.includes(player1.id)) {
                myId = player1.id;
            }
            var myLabels = SAVED_CHAR_MOVE_LABELS[myId];
            if (myLabels) {
                ALL_CHAR_IDS.forEach(function(id) {
                    CHAR_MOVE_BUTTON_LABELS[id] = {
                        light:   myLabels.light,
                        heavy:   myLabels.heavy,
                        special: myLabels.special
                    };
                });
            }
        } else {
            ALL_CHAR_IDS.forEach(function(id) {
                if (SAVED_CHAR_MOVE_LABELS[id]) {
                    CHAR_MOVE_BUTTON_LABELS[id] = {
                        light:   SAVED_CHAR_MOVE_LABELS[id].light,
                        heavy:   SAVED_CHAR_MOVE_LABELS[id].heavy,
                        special: SAVED_CHAR_MOVE_LABELS[id].special
                    };
                }
            });
        }
    }

    // =========================================================================
    // 1. 厳格な数値・ホワイトリスト安全フィルター
    // =========================================================================
    function clampNumber(val, min, max, fallback) {
        var n = Number(val);
        if (!Number.isFinite(n)) return fallback;
        return Math.max(min, Math.min(max, n));
    }

    function clampInt(val, min, max, fallback) {
        return Math.round(clampNumber(val, min, max, fallback));
    }

    function sanitizeUpgrades(rawUpg) {
        if (!rawUpg || typeof rawUpg !== 'object') return { atk: 1, hp: 1, mtr: 1 };
        return {
            atk: clampInt(rawUpg.atk, 1, 20, 1),
            hp:  clampInt(rawUpg.hp,  1, 20, 1),
            mtr: clampInt(rawUpg.mtr, 1, 20, 1)
        };
    }

    function sanitizeSafePosition(f, defaultX) {
        if (!f || typeof f !== 'object') return null;
        var sLeft = (typeof STAGE_LEFT === 'number') ? STAGE_LEFT : 60;
        var sRight = (typeof STAGE_RIGHT === 'number') ? STAGE_RIGHT : 900;
        var gY = (typeof GROUND_Y === 'number') ? GROUND_Y : 470;
        var st = String(f.state || 'idle');
        return {
            x: clampNumber(f.x, sLeft, sRight, defaultX || 240),
            y: clampNumber(f.y, -500, gY, gY),
            vx: clampNumber(f.vx, -40, 40, 0),
            vy: clampNumber(f.vy, -40, 40, 0),
            facing: f.facing === -1 ? -1 : 1,
            hp: clampNumber(f.hp, 0, 25000, 1000),
            maxHp: clampNumber(f.maxHp, 100, 25000, 1000),
            meter: clampNumber(f.meter, 0, 100, 0),
            state: ALLOWED_STATES.includes(st) ? st : 'idle',
            isBlocking: !!f.isBlocking
        };
    }

    function sanitizePacket(rawInput) {
        var raw = rawInput;
        if (typeof rawInput === 'string') {
            try { raw = JSON.parse(rawInput); } catch (e) { return null; }
        }
        if (!raw || typeof raw !== 'object') return null;
        var type = String(raw.type || '');
        if (!ALLOWED_PACKET_TYPES.includes(type)) return null;

        var clean = { type: type };

        if (type === 'hello' || type === 'char_select' || type === 'ready_sync' || type === 'launch_match') {
            var cid = String(raw.charId || 'ryuji');
            clean.charId = ALL_CHAR_IDS.includes(cid) ? cid : 'ryuji';
            var p1c = String(raw.p1CharId || 'ryuji');
            var p2c = String(raw.p2CharId || 'takeshi');
            clean.p1CharId = ALL_CHAR_IDS.includes(p1c) ? p1c : 'ryuji';
            clean.p2CharId = ALL_CHAR_IDS.includes(p2c) ? p2c : 'takeshi';
            clean.upgrades = sanitizeUpgrades(raw.upgrades);
            var aid = String(raw.auraId || 'none');
            clean.auraId = ALLOWED_AURAS.includes(aid) ? aid : 'none';
            clean.useUpgrades = !!raw.useUpgrades;
            clean.ready = !!raw.ready;
        } else if (type === 'rule_sync') {
            clean.useUpgrades = !!raw.useUpgrades;
        } else if (type === 'pad') {
            clean.left  = !!raw.left;
            clean.right = !!raw.right;
            clean.up    = !!raw.up;
            clean.down  = !!raw.down;
        } else if (type === 'attack') {
            var mv = String(raw.moveType || 'light');
            if (!ALLOWED_MOVES.includes(mv)) return null;
            clean.moveType = mv;
        } else if (type === 'p2_sync') {
            var pos = sanitizeSafePosition(raw.fighter, 720);
            if (!pos) return null;
            clean.fighter = pos;
        } else if (type === 'match_state') {
            var p1Pos = sanitizeSafePosition(raw.p1, 240);
            var p2Pos = sanitizeSafePosition(raw.p2, 720);
            if (!p1Pos || !p2Pos) return null;
            clean.roundTimer = clampInt(raw.roundTimer, 0, 99, 99);
            clean.currentRound = clampInt(raw.currentRound, 1, 9, 1);
            clean.p1Wins = clampInt(raw.p1Wins, 0, 5, 0);
            clean.p2Wins = clampInt(raw.p2Wins, 0, 5, 0);
            clean.p1 = p1Pos;
            clean.p2 = p2Pos;
        } else if (type === 'hit_sync') {
            clean.targetIsP1 = !!raw.targetIsP1;
            clean.hp = clampNumber(raw.hp, 0, 25000, 1000);
            clean.attackerMeter = clampNumber(raw.attackerMeter, 0, 100, 0);
            clean.defenderMeter = clampNumber(raw.defenderMeter, 0, 100, 0);
            clean.vx = clampNumber(raw.vx, -40, 40, 0);
            clean.vy = clampNumber(raw.vy, -40, 40, 0);
            clean.stateTimer = clampInt(raw.stateTimer, 0, 150, 18);
        } else if (type === 'round_end_sync') {
            clean.winnerIsP1 = !!raw.winnerIsP1;
            clean.p1Hp = clampNumber(raw.p1Hp, 0, 25000, 0);
            clean.p2Hp = clampNumber(raw.p2Hp, 0, 25000, 0);
        }
        return clean;
    }

    function sendOnlinePacket(payload) {
        if (!peerConn || !onlineConnected) return;
        try {
            peerConn.send(JSON.stringify(payload));
        } catch (e) {}
    }

    function generateSecure6DigitCode() {
        if (window.crypto && window.crypto.getRandomValues) {
            var arr = new Uint32Array(1);
            window.crypto.getRandomValues(arr);
            return String(100000 + (arr[0] % 900000));
        }
        return String(Math.floor(100000 + Math.random() * 900000));
    }

    function isCharUnlockedOnMyDevice(charId) {
        return !!(vsUnlocked[charId] || challengeUnlocked[charId]);
    }

    function safeReturnToTitleScreen() {
        try {
            if (typeof window.backToTitle === 'function') {
                window.backToTitle();
                return;
            }
            if (typeof window.returnToTitle === 'function') {
                window.returnToTitle();
                return;
            }
            gameState = 'title';
            var ts = document.getElementById('title-screen');
            var cs = document.getElementById('char-select-screen');
            if (ts) ts.classList.remove('hidden');
            if (cs) cs.classList.add('hidden');
        } catch (e) {}
    }

    // =========================================================================
    // 2. フレーム完了直後（requestAnimationFrame直後）の操作パネル＆超必殺ゲージ強制同期
    // =========================================================================
    function enforceMyControlPanelDOM() {
        if (!isOnlineMode || !onlineConnected) return;
        syncMoveLabelDictionaryForRole();

        var myFighter = (onlineRole === 'host') ? player1 : player2;
        var myCharId = (myFighter && ALL_CHAR_IDS.includes(myFighter.id)) ? myFighter.id : myOnlineCharId;
        var myLabels = SAVED_CHAR_MOVE_LABELS[myCharId];

        var deck = document.getElementById('controller-deck');
        if (!deck) return;

        var atkBtns = deck.querySelectorAll('.arcade-btn');
        if (!atkBtns || atkBtns.length < 4) {
            var rightPanel = deck.lastElementChild;
            if (rightPanel) atkBtns = rightPanel.querySelectorAll('button');
        }

        if (myLabels && atkBtns && atkBtns.length >= 3) {
            var mKeys = ['light', 'heavy', 'special'];
            for (var i = 0; i < 3; i++) {
                var wantedText = myLabels[mKeys[i]];
                if (!wantedText) continue;
                var btn = atkBtns[i];
                var children = btn.querySelectorAll('span, div');
                if (children.length > 0) {
                    var targetNode = children[children.length - 1];
                    if (targetNode.textContent !== wantedText) {
                        targetNode.textContent = wantedText;
                    }
                }
            }
        }

        var superBtn = document.getElementById('btn-super') || (atkBtns && atkBtns.length >= 4 ? atkBtns[3] : null);
        if (superBtn && myFighter) {
            var pct = Math.floor(Math.max(0, Math.min(100, Number(myFighter.meter) || 0)));
            var canSuper = (pct >= 100 && (myFighter.infectionTimer || 0) <= 0);
            if (canSuper) {
                if (!superBtn.classList.contains('super-ready')) superBtn.classList.add('super-ready');
            } else {
                if (superBtn.classList.contains('super-ready')) superBtn.classList.remove('super-ready');
            }
            var sNodes = superBtn.querySelectorAll('span, div');
            if (sNodes.length > 0) {
                var pctNode = sNodes[sNodes.length - 1];
                var wantedPctText = pct + '%';
                if (pctNode.textContent !== wantedPctText) {
                    pctNode.textContent = wantedPctText;
                }
            }
        }
    }

    if (!window.__ONLINE_RAF_HOOKED__) {
        window.__ONLINE_RAF_HOOKED__ = true;
        var origRAF = window.requestAnimationFrame;
        window.requestAnimationFrame = function(callback) {
            return origRAF.call(window, function(timestamp) {
                callback(timestamp);
                if (isOnlineMode && onlineConnected) {
                    enforceMyControlPanelDOM();
                }
            });
        };
    }

    if (!window.__ONLINE_CANVAS_TEXT_HOOKED__ && typeof CanvasRenderingContext2D !== 'undefined') {
        window.__ONLINE_CANVAS_TEXT_HOOKED__ = true;
        var origFillText = CanvasRenderingContext2D.prototype.fillText;
        CanvasRenderingContext2D.prototype.fillText = function(text, x, y, maxWidth) {
            if (isOnlineMode && onlineConnected && typeof text === 'string' && text.indexOf('CPU:') !== -1) {
                text = text.replace('CPU:', '2P:');
            }
            if (maxWidth !== undefined) return origFillText.call(this, text, x, y, maxWidth);
            return origFillText.call(this, text, x, y);
        };
        var origStrokeText = CanvasRenderingContext2D.prototype.strokeText;
        CanvasRenderingContext2D.prototype.strokeText = function(text, x, y, maxWidth) {
            if (isOnlineMode && onlineConnected && typeof text === 'string' && text.indexOf('CPU:') !== -1) {
                text = text.replace('CPU:', '2P:');
            }
            if (maxWidth !== undefined) return origStrokeText.call(this, text, x, y, maxWidth);
            return origStrokeText.call(this, text, x, y);
        };
    }

    // =========================================================================
    // 3. 最優先キャプチャによる4つの技ボタン＆超必殺技100%確実発動システム
    // =========================================================================
    function detectClickedAttackMoveType(targetEl) {
        if (!targetEl || !targetEl.closest) return null;
        var deck = document.getElementById('controller-deck');
        if (!deck || !deck.contains(targetEl)) return null;

        if (targetEl.closest('#btn-super'))   return 'super';
        if (targetEl.closest('#btn-special')) return 'special';
        if (targetEl.closest('#btn-heavy'))   return 'heavy';
        if (targetEl.closest('#btn-light'))   return 'light';

        var btn = targetEl.closest('.arcade-btn') || targetEl.closest('button');
        if (!btn) return null;
        if (btn.id === 'btn-up' || btn.id === 'btn-down' || btn.id === 'btn-left' || btn.id === 'btn-right') return null;

        var atkBtns = deck.querySelectorAll('.arcade-btn');
        if (!atkBtns || atkBtns.length < 4) {
            var rightPanel = deck.lastElementChild;
            if (rightPanel) atkBtns = rightPanel.querySelectorAll('button');
        }
        if (atkBtns) {
            var moveTypes = ['light', 'heavy', 'special', 'super'];
            for (var i = 0; i < atkBtns.length && i < 4; i++) {
                if (atkBtns[i] === btn || atkBtns[i].contains(btn)) {
                    return moveTypes[i];
                }
            }
        }
        return null;
    }

    function bindOnlinePadEvents() {
        var btnMap = [
            { id: 'btn-left',  key: 'left' },
            { id: 'btn-right', key: 'right' },
            { id: 'btn-up',    key: 'up' },
            { id: 'btn-down',  key: 'down' }
        ];
        btnMap.forEach(function(item) {
            var el = document.getElementById(item.id);
            if (!el || el.dataset.onlineBoundV10) return;
            el.dataset.onlineBoundV10 = '1';

            var setPress = function(val) {
                myLocalPad[item.key] = val;
            };
            el.addEventListener('pointerdown', function() { setPress(true); });
            el.addEventListener('pointerup', function() { setPress(false); });
            el.addEventListener('pointercancel', function() { setPress(false); });
            el.addEventListener('pointerleave', function() { setPress(false); });
            el.addEventListener('touchstart', function() { setPress(true); }, { passive: true });
            el.addEventListener('touchend', function() { setPress(false); }, { passive: true });
            el.addEventListener('touchcancel', function() { setPress(false); }, { passive: true });
            el.addEventListener('mousedown', function() { setPress(true); });
            el.addEventListener('mouseup', function() { setPress(false); });
        });

        if (!window.__ONLINE_GLOBAL_ATK_CAPTURE_V10__) {
            window.__ONLINE_GLOBAL_ATK_CAPTURE_V10__ = true;
            var lastAtkInputTime = 0;

            var globalAttackInterceptor = function(e) {
                if (!isOnlineMode || !onlineConnected || gameState !== 'playing') return;
                var mType = detectClickedAttackMoveType(e.target);
                if (!mType) return;

                e.stopImmediatePropagation();
                if (e.cancelable) e.preventDefault();

                var now = performance.now();
                if (now - lastAtkInputTime < 80) return;
                lastAtkInputTime = now;

                executeOnlineLocalAttack(mType);
            };

            window.addEventListener('pointerdown', globalAttackInterceptor, { capture: true, passive: false });
            window.addEventListener('touchstart',  globalAttackInterceptor, { capture: true, passive: false });
            window.addEventListener('mousedown',   globalAttackInterceptor, { capture: true, passive: false });
            window.addEventListener('click',       globalAttackInterceptor, { capture: true, passive: false });
        }

        if (!window.__ONLINE_KEY_V10_BOUND__) {
            window.__ONLINE_KEY_V10_BOUND__ = true;
            window.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') myLocalPad.left  = true;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') myLocalPad.right = true;
                if (e.key === 'ArrowUp'    || e.key === 'w' || e.key === 'W') myLocalPad.up    = true;
                if (e.key === 'ArrowDown'  || e.key === 's' || e.key === 'S') myLocalPad.down  = true;

                if (isOnlineMode && onlineConnected && gameState === 'playing' && !e.repeat) {
                    var k = e.key.toLowerCase();
                    if (k === 'j' || k === 'z') {
                        e.stopImmediatePropagation();
                        executeOnlineLocalAttack('light');
                    } else if (k === 'k' || k === 'x') {
                        e.stopImmediatePropagation();
                        executeOnlineLocalAttack('heavy');
                    } else if (k === 'l' || k === 'c') {
                        e.stopImmediatePropagation();
                        executeOnlineLocalAttack('special');
                    } else if (k === 'u' || k === 'i' || k === 'v' || k === ' ' || e.key === 'Enter') {
                        e.stopImmediatePropagation();
                        executeOnlineLocalAttack('super');
                    }
                }
            }, true);
            window.addEventListener('keyup', function(e) {
                if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') myLocalPad.left  = false;
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') myLocalPad.right = false;
                if (e.key === 'ArrowUp'    || e.key === 'w' || e.key === 'W') myLocalPad.up    = false;
                if (e.key === 'ArrowDown'  || e.key === 's' || e.key === 'S') myLocalPad.down  = false;
            }, true);
        }
    }

    function performMoveOnFighter(targetF, moveType) {
        if (!targetF || targetF.hp <= 0 || gameState !== 'playing') return false;
        if ((targetF.timeStopTimer || 0) > 0 || (targetF.freezeTimer || 0) > 0 || (targetF.zeroGravityTimer || 0) > 0) return false;
        if (targetF.state === 'hit' || targetF.state === 'ko' || targetF.state === 'dizzy') return false;

        if (moveType === 'super') {
            if ((targetF.infectionTimer || 0) > 0) {
                sfx.block();
                return false;
            }
            if (targetF.state === 'attack' && targetF.attackType === 'super') return false;

            if (targetF.state === 'attack') {
                targetF.state = 'idle';
                targetF.attackFrame = 0;
            }

            var savedP1Meter = player1 ? player1.meter : 0;
            targetF.meter = 100;
            if (player1 && targetF === player2) {
                player1.meter = 100;
            }

            var ok = false;
            try {
                if (typeof triggerSuperCutin === 'function') {
                    try { triggerSuperCutin(targetF); } catch (e) {}
                }
                ok = prevStartAttackOnline.call(targetF, 'super');
                if (!ok) {
                    targetF.state = 'attack';
                    targetF.attackType = 'super';
                    targetF.attackFrame = 0;
                    targetF.hasHit = false;
                    sfx.superFlash();
                    ok = true;
                }
            } finally {
                if (player1 && targetF === player2) {
                    player1.meter = savedP1Meter;
                }
            }

            targetF.meter = 0;
            return true;
        } else {
            return prevStartAttackOnline.call(targetF, moveType);
        }
    }

    function executeOnlineLocalAttack(moveType) {
        if (!isOnlineMode || !onlineConnected || gameState !== 'playing') return;
        sfx.init();
        var myFighter = (onlineRole === 'host') ? player1 : player2;
        if (!myFighter || myFighter.hp <= 0) return;

        if (moveType === 'super') {
            if ((Number(myFighter.meter) || 0) < 99.5 || (myFighter.infectionTimer || 0) > 0) {
                sfx.block();
                return;
            }
        }

        isExecutingRemoteAttack = true;
        var started = false;
        try {
            started = performMoveOnFighter(myFighter, moveType);
        } finally {
            isExecutingRemoteAttack = false;
        }

        if (started) {
            sendOnlinePacket({ type: 'attack', moveType: moveType });
            enforceMyControlPanelDOM();
        }
    }

    window.createOnlineRoom = function() {
        sfx.init(); sfx.superFlash();
        if (typeof window.Peer === 'undefined') {
            setLobbyStatusText('⚠️ 通信ライブラリの読み込み中です。2秒後にもう一度押してください。', 'text-rose-400');
            return;
        }
        cleanupPeerConnection();
        onlineRole = 'host';
        onlineRoomCode = generateSecure6DigitCode();
        var fullPeerId = ROOM_PREFIX + onlineRoomCode;

        var hostBox = document.getElementById('host-room-box');
        var codeDisp = document.getElementById('host-room-code-display');
        if (hostBox && codeDisp) {
            hostBox.classList.remove('hidden');
            codeDisp.textContent = onlineRoomCode;
        }
        setLobbyStatusText('⏳ 部屋を作成中...（番号: ' + onlineRoomCode + '）', 'text-amber-300');

        peerInstance = new Peer(fullPeerId, { debug: 0 });
        peerInstance.on('open', function() {
            setLobbyStatusText('🟢 待機中！友人が「' + onlineRoomCode + '」を入力すると自動でキャラ選択へ進みます', 'text-emerald-300');
        });
        peerInstance.on('connection', function(conn) {
            if (peerConn) {
                conn.close();
                return;
            }
            peerConn = conn;
            setupDataConnectionHandlers(conn);
        });
        peerInstance.on('error', function(err) {
            if (err && err.type === 'unavailable-id') {
                window.createOnlineRoom();
                return;
            }
            setLobbyStatusText('❌ 通信エラーが発生しました。もう一度部屋を作り直してください。', 'text-rose-400');
        });
    };

    window.joinOnlineRoom = function() {
        sfx.init(); sfx.superFlash();
        if (typeof window.Peer === 'undefined') {
            setLobbyStatusText('⚠️ 通信ライブラリの読み込み中です。2秒後にもう一度押してください。', 'text-rose-400');
            return;
        }
        var inputEl = document.getElementById('guest-room-input');
        var code = inputEl ? String(inputEl.value || '').replace(/[^0-9]/g, '') : '';
        if (code.length !== 6) {
            sfx.hitLight();
            setLobbyStatusText('⚠️ 6桁の数字ルーム番号を正しく入力してください', 'text-rose-400');
            return;
        }

        cleanupPeerConnection();
        onlineRole = 'guest';
        onlineRoomCode = code;
        setLobbyStatusText('⏳ ルーム「' + code + '」へ接続しています...', 'text-sky-300');

        peerInstance = new Peer({ debug: 0 });
        peerInstance.on('open', function() {
            var conn = peerInstance.connect(ROOM_PREFIX + code, { reliable: true });
            peerConn = conn;
            setupDataConnectionHandlers(conn);
        });
        peerInstance.on('error', function() {
            setLobbyStatusText('❌ ルーム「' + code + '」が見つからないか、接続できませんでした。', 'text-rose-400');
        });
    };

    function getMyCharPacket(typeStr, readyFlag) {
        var cid = ALL_CHAR_IDS.includes(myOnlineCharId) ? myOnlineCharId : 'ryuji';
        var myUpg = (charUpgrades && charUpgrades[cid]) ? charUpgrades[cid] : { atk: 1, hp: 1, mtr: 1 };
        var p1c = (onlineRole === 'host') ? cid : remotePeerCharId;
        var p2c = (onlineRole === 'host') ? remotePeerCharId : cid;
        return {
            type: typeStr,
            charId: cid,
            p1CharId: p1c,
            p2CharId: p2c,
            upgrades: { atk: myUpg.atk || 1, hp: myUpg.hp || 1, mtr: myUpg.mtr || 1 },
            auraId: (typeof equippedAuraId !== 'undefined' && equippedAuraId) ? equippedAuraId : 'none',
            useUpgrades: !!onlineUseUpgrades,
            ready: !!readyFlag
        };
    }

    // ★1P・2Pのどちらが後からスタートボタンを押しても、双方から launch_match を3連送信して100%確実に同時スタートさせる関数
    function checkAndTriggerBothReadyLaunch() {
        if (!isOnlineMode || !onlineConnected || gameState === 'playing' || isLaunchingMatch) return;
        if (myReadyState && remoteReadyState) {
            isLaunchingMatch = true;
            var launchPkt = getMyCharPacket('launch_match', true);
            sendOnlinePacket(launchPkt);
            launchRetryTimers.push(setTimeout(function() { sendOnlinePacket(launchPkt); }, 120));
            launchRetryTimers.push(setTimeout(function() { sendOnlinePacket(launchPkt); }, 300));
            executeOnlineMatchStart();
        }
    }

    function onConnectionOpened() {
        if (onlineConnected) return;
        onlineConnected = true;
        isOnlineMode = true;
        myReadyState = false;
        remoteReadyState = false;
        isLaunchingMatch = false;
        sfx.superFlash();

        var modal = document.getElementById('online-lobby-modal');
        if (modal) modal.classList.add('hidden');

        myOnlineCharId = (onlineRole === 'host') ? 'ryuji' : 'takeshi';
        remotePeerCharId = (onlineRole === 'host') ? 'takeshi' : 'ryuji';

        openMode('vs');
        isOnlineMode = true;
        setOpponentSelectBoxVisibility(true);
        enforceAlleyStageAndRockBgm(true);

        if (onlineRole === 'host') {
            selectedP1Id = myOnlineCharId;
            selectedP2Id = remotePeerCharId;
        } else {
            selectedP1Id = remotePeerCharId;
            selectedP2Id = myOnlineCharId;
        }

        syncMoveLabelDictionaryForRole();
        sendOnlinePacket(getMyCharPacket('hello', false));
        startSelectHeartbeat();

        refreshCharacterCardsUI();
        syncSelectPreviewFighters();
    }

    function setupDataConnectionHandlers(conn) {
        if (!conn) return;

        conn.on('open', function() {
            onConnectionOpened();
        });

        conn.on('data', function(rawData) {
            try {
                if (!onlineConnected) onConnectionOpened();
                var pkt = sanitizePacket(rawData);
                if (!pkt) return;

                if (pkt.type === 'bye') {
                    cleanupPeerConnection();
                    safeReturnToTitleScreen();
                    alert('🌐 対戦相手が通信を切断し、ルームを退出しました。');
                    return;
                }

                if (pkt.type === 'hello' || pkt.type === 'char_select' || pkt.type === 'ready_sync') {
                    var charChanged = (remotePeerCharId !== pkt.charId);
                    remotePeerCharId = pkt.charId;
                    remotePeerUpgrades = pkt.upgrades;
                    remotePeerAuraId = pkt.auraId;
                    remoteReadyState = !!pkt.ready;

                    if (onlineRole === 'guest' && pkt.type === 'hello') {
                        onlineUseUpgrades = pkt.useUpgrades;
                    }
                    if (onlineRole === 'host') {
                        selectedP1Id = myOnlineCharId;
                        selectedP2Id = remotePeerCharId;
                    } else {
                        selectedP1Id = remotePeerCharId;
                        selectedP2Id = myOnlineCharId;
                    }
                    updateOnlineRuleButtonsUI();
                    refreshCharacterCardsUI();
                    if (charChanged && gameState !== 'playing') {
                        syncSelectPreviewFighters();
                    }
                    checkAndTriggerBothReadyLaunch();
                } else if (pkt.type === 'rule_sync') {
                    if (onlineRole === 'guest') {
                        onlineUseUpgrades = pkt.useUpgrades;
                        updateOnlineRuleButtonsUI();
                        syncSelectPreviewFighters();
                    }
                } else if (pkt.type === 'launch_match') {
                    if (gameState !== 'playing' && !isLaunchingMatch) {
                        isLaunchingMatch = true;
                        remotePeerCharId = pkt.charId;
                        remotePeerUpgrades = pkt.upgrades;
                        remotePeerAuraId = pkt.auraId;
                        if (onlineRole === 'guest') {
                            onlineUseUpgrades = pkt.useUpgrades;
                            selectedP1Id = remotePeerCharId;
                            selectedP2Id = myOnlineCharId;
                        } else {
                            selectedP1Id = myOnlineCharId;
                            selectedP2Id = remotePeerCharId;
                        }
                        executeOnlineMatchStart();
                    }
                } else if (pkt.type === 'pad') {
                    remoteOnlinePad.left  = pkt.left;
                    remoteOnlinePad.right = pkt.right;
                    remoteOnlinePad.up    = pkt.up;
                    remoteOnlinePad.down  = pkt.down;
                } else if (pkt.type === 'attack') {
                    if (gameState === 'playing') {
                        var targetF = (onlineRole === 'host') ? player2 : player1;
                        if (targetF && targetF.hp > 0) {
                            isExecutingRemoteAttack = true;
                            try {
                                performMoveOnFighter(targetF, pkt.moveType);
                            } finally {
                                isExecutingRemoteAttack = false;
                            }
                        }
                    }
                } else if (pkt.type === 'hit_sync') {
                    if (gameState === 'playing' && player1 && player2) {
                        var defF = pkt.targetIsP1 ? player1 : player2;
                        var atkF = pkt.targetIsP1 ? player2 : player1;
                        if (pkt.hp < defF.hp) {
                            defF.hp = pkt.hp;
                            defF.state = (defF.hp <= 0) ? 'ko' : 'hit';
                            defF.stateTimer = pkt.stateTimer;
                            defF.vx = pkt.vx;
                            defF.vy = pkt.vy;
                            spawnHitSparks(defF.x, defF.y - 85, '#fde047', 12);
                        }
                        if (atkF.state !== 'attack' || atkF.attackType !== 'super') {
                            atkF.meter = Math.max(atkF.meter, pkt.attackerMeter);
                        }
                        if (defF.state !== 'attack' || defF.attackType !== 'super') {
                            defF.meter = Math.max(defF.meter, pkt.defenderMeter);
                        }
                        if (defF.hp <= 0 && gameState === 'playing') {
                            isApplyingRemoteRoundEnd = true;
                            try { handleRoundEnd(atkF); } finally { isApplyingRemoteRoundEnd = false; }
                        }
                    }
                } else if (pkt.type === 'round_end_sync') {
                    if (gameState === 'playing' && player1 && player2) {

    function driveFighterWithPad(f, pad, opponent) {
        if (!f || f.hp <= 0 || gameState !== 'playing') return;
        if (f.timeStopTimer > 0 || f.freezeTimer > 0 || f.zeroGravityTimer > 0) return;
        if (f.state === 'hit' || f.state === 'ko' || f.state === 'dizzy' || f.state === 'attack') return;

        var effLeft  = (f.infectionTimer > 0) ? pad.right : pad.left;
        var effRight = (f.infectionTimer > 0) ? pad.left  : pad.right;
        var effUp    = (f.infectionTimer > 0) ? pad.down  : pad.up;
        var effDown  = (f.infectionTimer > 0) ? pad.up    : pad.down;

        var holdingBack = (f.facing === 1 && effLeft) || (f.facing === -1 && effRight);
        f.isBlocking = !!(effDown || (holdingBack && opponent && opponent.state === 'attack'));

        var jumpVel = (typeof JUMP_VELOCITY === 'number') ? JUMP_VELOCITY : -16.5;
        var moveSpd = (typeof MOVE_SPEED === 'number') ? MOVE_SPEED : 6.5;
        if (f.id === 'baby') moveSpd *= 1.18;
        if ((f.inkBlindTimer || 0) > 0) moveSpd *= 0.72;
        if (f.id === 'traffic' && f.trafficColor === 'green') moveSpd *= 1.35;

        if (effUp && f.isGrounded) {
            f.vy = jumpVel;
            f.isGrounded = false;
            f.state = 'jump';
            sfx.whiff();
        }

        if (f.id === 'dragon' && !f.isGrounded && effUp && f.vy > -1.5) {
            f.vy = Math.sin(f.animTime * 0.2) * 0.6;
        }

        var sLeft = (typeof STAGE_LEFT === 'number') ? STAGE_LEFT : 60;
        var sRight = (typeof STAGE_RIGHT === 'number') ? STAGE_RIGHT : 900;

        if (effDown && f.isGrounded) {
            f.state = 'crouch';
            f.vx = 0;
        } else if (effLeft) {
            f.vx = -moveSpd;
            f.x = Math.max(sLeft, Math.min(sRight, f.x + f.vx));
            if (f.isGrounded) f.state = 'walk';
        } else if (effRight) {
            f.vx = moveSpd;
            f.x = Math.max(sLeft, Math.min(sRight, f.x + f.vx));
            if (f.isGrounded) f.state = 'walk';
        } else {
            f.vx = 0;
            if (f.isGrounded) f.state = 'idle';
        }
    }

                    input.left  = false;
                    input.right = false;
                    input.up    = false;
                    input.down  = false;

                prevFighterUpdateOnline.call(this, opponent);

                if (this.isP1) {

                } else {

    function syncGuestControlledP2ToHost(targetP2, snap) {
        if (targetP2.state !== 'hit' && targetP2.state !== 'ko' && targetP2.state !== 'dizzy') {
            if (Math.abs(targetP2.x - snap.x) > 80) {
                targetP2.x = snap.x;
                targetP2.y = snap.y;
            } else {
                targetP2.x += (snap.x - targetP2.x) * 0.75;
                targetP2.y += (snap.y - targetP2.y) * 0.75;
            }
            targetP2.vx = snap.vx;
            targetP2.vy = snap.vy;
            targetP2.isBlocking = snap.isBlocking;
            if (targetP2.state !== 'attack' && snap.state !== 'attack') {
                targetP2.state = snap.state;
            }
        }
        if (targetP2.state !== 'attack' || targetP2.attackType !== 'super') {
            targetP2.meter = Math.max(targetP2.meter, snap.meter);
        }
    }

    function applyHostMatchStateToGuest(pkt) {
        if (typeof roundTimer !== 'undefined') roundTimer = pkt.roundTimer;
        if (typeof p1RoundWins !== 'undefined') p1RoundWins = pkt.p1Wins;
        if (typeof p2RoundWins !== 'undefined') p2RoundWins = pkt.p2Wins;
        var calcRound = (pkt.p1Wins || 0) + (pkt.p2Wins || 0) + 1;
        try { currentRound = calcRound; } catch (e) {}

        if (player1.state !== 'hit' && player1.state !== 'ko') {
            if (Math.abs(player1.x - pkt.p1.x) > 80) {
                player1.x = pkt.p1.x;
                player1.y = pkt.p1.y;
            } else {
                player1.x += (pkt.p1.x - player1.x) * 0.75;
                player1.y += (pkt.p1.y - player1.y) * 0.75;
            }
            if (player1.state !== 'attack' && pkt.p1.state !== 'attack') {
                player1.state = pkt.p1.state;
            }
        }
        player1.facing = pkt.p1.facing;
        player1.maxHp = pkt.p1.maxHp;
        if (pkt.p1.hp < player1.hp) spawnHitSparks(player1.x, player1.y - 85, '#fde047', 8);
        player1.hp = pkt.p1.hp;
        player1.meter = pkt.p1.meter;
        player1.isBlocking = pkt.p1.isBlocking;

        player2.maxHp = pkt.p2.maxHp;
        if (pkt.p2.hp < player2.hp) spawnHitSparks(player2.x, player2.y - 85, '#ef4444', 8);
        player2.hp = pkt.p2.hp;
        if (player2.state !== 'attack' || player2.attackType !== 'super') {
            player2.meter = Math.max(player2.meter, pkt.p2.meter);
        }

        enforceMyControlPanelDOM();

        if (gameState === 'playing' && (player1.hp <= 0 || player2.hp <= 0)) {
            var winner = player1.hp <= 0 ? player2 : player1;
            isApplyingRemoteRoundEnd = true;
            try { handleRoundEnd(winner); } finally { isApplyingRemoteRoundEnd = false; }
        }
    }

    var prevStartNextRoundOnline = startNextRound;
    startNextRound = function() {
        if (isOnlineMode && onlineConnected && onlineRole === 'host') {
            sendOnlinePacket({ type: 'round_next' });
        }
        syncMoveLabelDictionaryForRole();
        prevStartNextRoundOnline.apply(this, arguments);
        if (isOnlineMode && onlineConnected) {
            if (player1 && player2) {
                player1.x = 240; player1.facing = 1;
                player2.x = 720; player2.facing = -1;
            }
            enforceMyControlPanelDOM();
        }
    };

    var prevBackToSelectOnline = window.backToSelect;
    window.backToSelect = function() {
        var discBtn = document.getElementById('btn-online-battle-disconnect');
        if (discBtn) discBtn.classList.add('hidden');
        myReadyState = false;
        remoteReadyState = false;
        isLaunchingMatch = false;
        clearLaunchRetryTimers();
        if (isOnlineMode && onlineConnected) {
            sendOnlinePacket({ type: 'rematch' });
            startSelectHeartbeat();
        }
        prevBackToSelectOnline();
        enforceAlleyStageAndRockBgm(true);
    };

    function initOnlineVsPatchV10() {
        backupOriginalMoveLabels();
        injectOnlineUI();
        enforceAlleyStageAndRockBgm(true);
    }

    initOnlineVsPatchV10();
    window.addEventListener('DOMContentLoaded', initOnlineVsPatchV10);
})();
</script>
</body>
</html>
